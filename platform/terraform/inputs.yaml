# Who owns each input of this root's module calls (tools/mlz/inputs.py says how to read it); the page
# docs/reference/platform.md is written from it. An input mlz-core does not set is `open`.

connectivity:
  builds: each region's hub network with its firewall and policy, DNS resolver and Bastion, and the Private Link DNS zones
  file: connectivity
  notes:
    hub_virtual_networks: one hub per connectivity/<region>.yaml, keyed by the region
    hub_virtual_networks.firewall: every hub has one
    hub_virtual_networks.bastion: built when the hub file says bastion true
    hub_virtual_networks.dns_resolver: built unless the hub file says dns_resolver false
  inputs:
    parent_id: {class: derived, by: "the connectivity subscription: customer.yaml's subscriptions.connectivity, through the governance contract"}
    hub_virtual_networks.location: {class: derived, by: "the region: the file's name"}
    hub_virtual_networks.address_space: {class: derived, by: "the first /22 of platform_address_space"}
    hub_virtual_networks.is_primary: {class: derived, by: "customer.yaml's primary_region, through the governance contract"}
    hub_virtual_networks.name: {class: derived, by: "the naming template", names: virtual_network}
    hub_virtual_networks.resource_group_name: {class: derived, by: "the naming template", names: resource_group}
    hub_virtual_networks.routing_supernet: {class: derived, by: "what the other hubs send to this hub's firewall: platform_address_space (unless a landing zone range holds it) and landing_zone_ranges"}
    hub_virtual_networks.spoke_address_prefixes: {class: closed, why: "only for a gateway's route table, and the hubs have no gateway yet"}
    hub_virtual_networks.virtual_network_dns_servers: open
    hub_virtual_networks.gateway_subnet_address_prefix: {class: closed, why: "the hubs have no VPN or ExpressRoute gateway yet; the layout keeps the hub's third /27 for GatewaySubnet"}
    hub_virtual_networks.gateway_route_table_name: {class: closed, why: "the hubs have no gateway yet"}
    hub_virtual_networks.firewall.name: {class: derived, by: "the naming template", names: firewall}
    hub_virtual_networks.firewall.sku_tier: {class: setting, key: firewall}
    hub_virtual_networks.firewall.zones: open
    hub_virtual_networks.firewall.subnet_address_prefix: {class: derived, by: "the first /26 of the hub's /22"}
    hub_virtual_networks.firewall.management_subnet_address_prefix: {class: derived, by: "the second /26 of the hub's /22, for a Basic firewall only"}
    hub_virtual_networks.firewall.public_ip_name: {class: derived, by: "the naming template", names: firewall_public_ip}
    hub_virtual_networks.firewall.management_public_ip_name: {class: derived, by: "the naming template, for a Basic firewall only", names: firewall_management_public_ip}
    hub_virtual_networks.firewall.route_table_name: {class: derived, by: "the naming template", names: firewall_route_table}
    hub_virtual_networks.firewall.default_route: {class: closed, why: "anything but Internet is forced tunnelling, which needs the management subnet, and mlz-core gives one to a Basic firewall only"}
    hub_virtual_networks.firewall.firewall_policy_id: {class: closed, why: "the firewall-rules stack writes its rules into the policy the hub makes, found by its name"}
    hub_virtual_networks.firewall.firewall_policy.name: {class: derived, by: "the naming template", names: firewall_policy}
    hub_virtual_networks.firewall.firewall_policy.base_policy_id: open
    hub_virtual_networks.firewall.firewall_policy.threat_intelligence_mode: open
    hub_virtual_networks.firewall.firewall_policy.dns_proxy_enabled: {class: fixed, why: "on except on Basic: management's, identity's and the landing zones' networks resolve through the firewall (tools/mlz/platform.py, spoke())"}
    hub_virtual_networks.firewall.firewall_policy.dns_servers: open
    hub_virtual_networks.nat_gateway: {class: closed, why: "mlz-core gives it no name yet (tools/mlz/names.py, HUB), and this root passes no naming template"}
    hub_virtual_networks.bastion.name: {class: derived, by: "the naming template", names: bastion}
    hub_virtual_networks.bastion.subnet_address_prefix: {class: derived, by: "the first /26 of the hub's second /24"}
    hub_virtual_networks.bastion.sku: open
    hub_virtual_networks.bastion.zones: open
    hub_virtual_networks.bastion.public_ip_name: {class: derived, by: "the naming template", names: bastion_public_ip}
    hub_virtual_networks.bastion.scale_units: open
    hub_virtual_networks.bastion.copy_paste_enabled: open
    hub_virtual_networks.bastion.file_copy_enabled: open
    hub_virtual_networks.bastion.ip_connect_enabled: open
    hub_virtual_networks.bastion.kerberos_enabled: open
    hub_virtual_networks.bastion.shareable_link_enabled: open
    hub_virtual_networks.bastion.tunneling_enabled: open
    hub_virtual_networks.dns_resolver.name: {class: derived, by: "the naming template", names: dns_resolver}
    hub_virtual_networks.dns_resolver.inbound_subnet_address_prefix: {class: derived, by: "the /28 after Bastion's subnet"}
    hub_virtual_networks.dns_resolver.inbound_subnet_name: {class: fixed, why: "a subnet takes its name inside its network, not from the naming template (docs/naming.md)"}
    hub_virtual_networks.dns_resolver.inbound_endpoint_name: {class: derived, by: "the naming template", names: dns_resolver_inbound_endpoint}
    hub_virtual_networks.dns_resolver.outbound_subnet_address_prefix: {class: derived, by: "the /28 after the inbound one"}
    hub_virtual_networks.dns_resolver.outbound_subnet_name: {class: fixed, why: "a subnet takes its name inside its network, not from the naming template (docs/naming.md)"}
    hub_virtual_networks.dns_resolver.outbound_endpoint_name: {class: derived, by: "the naming template", names: dns_resolver_outbound_endpoint}
    hub_virtual_networks.vpn_gateway: {class: closed, why: "no VPN gateway yet: every peering is made without remote gateways, and mlz-core has no name for one"}
    hub_virtual_networks.express_route_gateway: {class: closed, why: "no ExpressRoute gateway yet: every peering is made without remote gateways, and mlz-core has no name for one"}
    mesh_peering_enabled: {class: fixed, why: "the hubs peer with each other, so each sends the others' ranges to their firewalls"}
    connection_secrets: {class: closed, why: "only for gateway connections, and the hubs have no gateway yet"}
    ddos_protection_plan_id: open
    private_dns_zones.resource_group_name: {class: derived, by: "the naming template: the DNS zones' group, which governance's DNS policy points at"}
    private_dns_zones.zone_name_filter: open
    private_dns_zones.excluded_zones: open
    private_dns_zones.additional_zones: open
    naming: {class: fixed, why: "mlz-core names every component itself (tools/mlz/names.py): one left without a name fails the plan rather than take another scheme's"}
    diagnostic_settings.name: {class: derived, by: "to-<org>-workspace, from customer.yaml's naming"}
    diagnostic_settings.logs: {class: fixed, value: [{category_group: allLogs}], why: "every log goes to the central workspace"}
    diagnostic_settings.metrics: open
    diagnostic_settings.log_analytics_destination_type: {class: fixed, why: "Azure's resource-specific tables: a table per kind of log (rule hits, threat intelligence, DNS proxy)"}
    diagnostic_settings.workspace_resource_id: {class: derived, by: "management's workspace, from the governance contract"}
    diagnostic_settings.storage_account_resource_id: open
    diagnostic_settings.event_hub_authorization_rule_resource_id: open
    diagnostic_settings.event_hub_name: open
    diagnostic_settings.marketplace_partner_resource_id: open
    tags: {class: fixed, value: {ManagedBy: mlz-core}, why: "what mlz-core built, at a glance"}
    retry: open
    timeouts: open
    resource_types: {class: fixed, why: "the API versions the module is tested with; new ones come with a module release"}
    ignore_body_changes: {class: fixed, why: "every difference Azure shows is planned, and the daily check reports drift"}
