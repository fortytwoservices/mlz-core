# This repo's pipeline: mlz-core's platform role, at the release pinned below. The file belongs to mlz-core:
# an upgrade (python3 -m mlz upgrade) replaces it with the new release's version, so keep settings in the YAML.
name: mlz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # daily drift check
  workflow_dispatch:

# A new push to a pull request cancels its older run, so an older plan never replaces the newer one's
# comment. Other runs never cancel each other here (a group of their own); main's runs queue below.
concurrency:
  group: mlz-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write # the daily check's drift issue

jobs:
  platform:
    # Runs on main go one at a time, first in first out, so each one plans only after the one before has
    # applied, and the plan a reviewer approves already includes it. Pull requests and the daily drift check
    # get a group of their own and never wait here.
    concurrency:
      group: mlz-main-${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'queue' || github.run_id }}
      queue: max
    uses: fortytwoservices/mlz-core/.github/workflows/role.yml@v0.3.4 # x-release-please-version
    with:
      role: platform
    # By name: mlz-core is in another organisation, which `secrets: inherit` does not reach.
    secrets:
      MLZ_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
