# This repo's pipeline: mlz-core's vending role, at the release pinned below. The file belongs to mlz-core:
# an upgrade (python3 -m mlz upgrade) replaces it with the new release's version, so keep settings in the YAML.
name: mlz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # daily drift check
  workflow_dispatch:

# A new push to a pull request cancels its older run, so an older plan never replaces the newer one's
# comment. Other runs never cancel each other here (a group of their own).
concurrency:
  group: mlz-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write # the daily check's drift issue

jobs:
  # The job's name is in its checks' names: main's ruleset requires vending / check to pass before a merge.
  vending:
    # No queue on main: a landing zone's change never waits behind another's. Each run plans only the landing zones
    # it touches, a landing zone applies one run at a time, and an apply refuses a state another run changed after
    # its plan (docs/pipelines.md).
    uses: fortytwoservices/mlz-core/.github/workflows/role.yml@v0.11.1 # x-release-please-version
    with:
      role: vending
    # By name: the one secret role.yml takes, and no other.
    secrets:
      MLZ_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
