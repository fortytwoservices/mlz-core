name: check

# check and pr-title are the two required checks on main. One workflow, so that a pull request whose run
# must be approved (a release pull request opened with GITHUB_TOKEN) needs one approval, not two. Editing
# the title or description reruns both jobs: skipping check on an edit would report it as passed.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The title becomes the squash commit, from which release-please computes the version.
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|ci|chore|refactor|perf|build|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::The title becomes the squash commit and sets the version; use Conventional Commits, e.g. 'feat(governance): add zones' or 'fix!: rename output'. Got: $TITLE"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Loader tests
        run: python3 -m unittest discover -s tools -t tools -v

      - name: Terraform format
        run: terraform fmt -check -recursive -diff

      # What ./mlz check does in a new customer's repos: the governance starter renders, and the platform and vending
      # starters wait, the platform for its first hub, vending for the contracts.
      - name: Check the starters
        run: |
          for role in governance platform vending; do
            PYTHONPATH=tools python3 -m mlz check --repo starter/mlz-$role
          done

      # validate needs no Azure sign-in, and the az-tf-mlz-* modules are public, so no token either; the plan
      # in the sandbox is run by hand until mlz-core has a CI identity.
      - name: Validate the roots
        run: |
          for root in bootstrap governance platform platform/rules platform/networks vending; do
            echo "::group::$root"
            terraform -chdir=$root/terraform init -backend=false -input=false -lockfile=readonly
            terraform -chdir=$root/terraform validate
            echo "::endgroup::"
          done

      # What each pinned module declares, which the input maps beside the roots are checked against (the loader
      # tests): the init above downloaded every module at its pin.
      - name: Module inputs at their pins
        run: PYTHONPATH=tools python3 -m mlz inputs --check

      # Plans with the providers mocked, so no Azure either: what a root builds for a given config.
      - name: Test the roots
        run: |
          terraform -chdir=vending/terraform test
          terraform -chdir=platform/terraform test
