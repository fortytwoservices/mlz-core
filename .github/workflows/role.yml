# One role's pipeline, called from the customer's repo with the role's name:
#
#   jobs:
#     mlz:
#       uses: fortytwoservices/mlz-core/.github/workflows/role.yml@vX.Y.Z
#       with:
#         role: governance
#       secrets:
#         MLZ_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
#
# The secret is passed by name: `secrets: inherit` only reaches a workflow in the caller's own organisation
# or enterprise, and mlz-core is called from the customer's.
#
# check  every run: checks the YAML and works out what the roots read.
# plan   pull requests, main and the daily drift check: read-only, against a copy of the state. Its summary
#        goes on the pull request and on the run page, where the reviewer approves the apply.
# changed main: the stacks whose plan changes something; only those wait for a reviewer and apply.
# apply  main: in the role's environment, after a reviewer approves. Applies only if its plan makes
#        exactly the reviewed changes.
# publish main: offers the role's contract to the repos that read it, as a pull request each.
# merge  a contract pull request: merges it once check and plan have passed on it.
# drift  the daily check: one issue in the repo while a stack differs from main or its plan did not finish.
# decommission  vending, main: the pull requests that delete a decommissioned landing zone's files.
#
# The bootstrap sets the variables (AZURE_*, TFSTATE_*, MLZ_REPOSITORIES); docs/pipelines.md lists the rest.
# plan, apply and publish reach Azure and the state, so they run on the private runner in management's network
# once mlz install runners sets MLZ_RUNS_ON; check and merge never do, and stay on GitHub's public runners.
name: mlz role

on:
  workflow_call:
    inputs:
      role:
        description: "governance, platform or vending"
        type: string
        required: true
    secrets:
      MLZ_RELEASE_APP_PRIVATE_KEY:
        description: "the private key of the customer's MLZ App, which opens and merges the contract pull requests and commits the IP plan"
        required: true

permissions: {}

env:
  ROLE: ${{ inputs.role }}
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  # Terraform's version check reaches a host the private runners' firewall does not allow, and is not needed.
  CHECKPOINT_DISABLE: "1"
  # Python runs from the customer's checkout, which a pull request controls. Without this, a file such as
  # mlz/ or json.py at its root would be imported before mlz-core's own code and the standard library, in a
  # step that may hold a write token. Python 3.11 and later honour it.
  PYTHONSAFEPATH: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      core-repository: ${{ steps.core.outputs.repository }}
      core-ref: ${{ steps.core.outputs.ref }}
      stacks: ${{ steps.check.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The caller pins mlz-core with uses: ...@<release>; job.workflow_sha is the commit that release points
      # at, and every job checks out mlz-core there, so the code is always exactly the workflow's own. An
      # empty value would make actions/checkout fetch the caller's own repo as .mlz-core, whose scripts a
      # pull request controls, so this stops instead.
      - name: Find the mlz-core release
        id: core
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! $WORKFLOW_SHA =~ ^[0-9a-f]{40}$ || -z $WORKFLOW_REPOSITORY || $WORKFLOW_REPOSITORY == "$GITHUB_REPOSITORY" ]]; then
            echo "::error::GitHub did not say which mlz-core commit this workflow comes from (job.workflow_repository '$WORKFLOW_REPOSITORY', job.workflow_sha '$WORKFLOW_SHA')."
            exit 1
          fi
          echo "$WORKFLOW_REPOSITORY ${WORKFLOW_REF#*@} at $WORKFLOW_SHA"
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.ref }}
          path: .mlz-core
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      # On a vending pull request, a new landing zone or subnet gets its addresses and names here: the allocator
      # runs and its plan and names are committed to the pull request, which starts the run that plans with them.
      - id: plan-writer
        if: inputs.role == 'vending' && github.event_name == 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write # to bring a branch up to date with its base first

      - name: Bring the IP plan and the names up to date
        if: inputs.role == 'vending' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.plan-writer.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .mlz-core/tools/ci/ip-plan.sh

      - name: Check the YAML
        id: check
        run: |
          stacks=$(.mlz-core/tools/ci/check.sh "$ROLE")  # its own assignment, so that a failed check fails the step
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlz-${{ inputs.role }}
          path: .mlz/
          include-hidden-files: true
          retention-days: 7

  plan:
    if: needs.check.outputs.stacks != '[]'
    needs: check
    runs-on: ${{ vars.MLZ_RUNS_ON || 'ubuntu-latest' }} # the private runner once mlz install runners sets it
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # signs in as the plan identity
      pull-requests: write  # puts the plan on the pull request
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.check.outputs.stacks) }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # the plan identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.core-repository }}
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlz-${{ inputs.role }}
          path: .mlz/

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Vending's stacks read each landing zone's workload repo in the organization, as the MLZ App: the repo's and
      # the organization's IDs, for the identities' trust, and what vending made there. Read only. The action passes
      # on any permission-* input; Variables (actions_variables) is not among the ones it lists, hence a warning.
      - id: github-reader
        if: inputs.role == 'vending'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: read
          permission-environments: read
          permission-actions-variables: read
          permission-members: read

      - name: Plan
        id: plan
        env:
          STACK: ${{ matrix.stack }}
          GITHUB_TOKEN: ${{ steps.github-reader.outputs.token }} # vending's GitHub provider; empty for the others
          GITHUB_OWNER: ${{ github.repository_owner }} # its owner when a landing zone has no repo (providers.tf)
        run: |
          set +e
          .mlz-core/tools/ci/plan.sh "$ROLE" "$STACK"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Show the plan on the run page
        if: steps.plan.outputs.status != '1'
        env:
          STACK: ${{ matrix.stack }}
        run: cat ".mlz/summary-$STACK.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.status != '1'
        with:
          name: mlz-${{ inputs.role }}-plan-${{ matrix.stack }}
          path: |
            .mlz/plan-${{ matrix.stack }}.txt
            .mlz/summary-${{ matrix.stack }}.md
            .mlz/changes-${{ matrix.stack }}.txt
          include-hidden-files: true
          retention-days: 30

      # For the drift job: what the daily check's plan of this stack found, or none when the job stopped before
      # planning. Always written, so a re-run's never leaves an earlier attempt's in place.
      - name: Record the plan's status
        if: always() && github.event_name == 'schedule'
        env:
          STACK: ${{ matrix.stack }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: |
          mkdir -p .mlz
          echo "${STATUS:-none}" > ".mlz/status-$STACK.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'schedule'
        with:
          name: mlz-${{ inputs.role }}-status-${{ matrix.stack }}
          path: .mlz/status-${{ matrix.stack }}.txt
          include-hidden-files: true
          overwrite: true # a re-run's plan replaces the failed one's
          retention-days: 7

      - name: Put the plan on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STACK: ${{ matrix.stack }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: .mlz-core/tools/ci/comment.sh "$STACK" "$STATUS"

      - name: Result
        env:
          EVENT: ${{ github.event_name }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: |
          if [[ $STATUS == 1 ]]; then echo "::error::The plan failed."; exit 1; fi
          if [[ $STATUS == 3 ]]; then
            echo "::error::The plan is refused: it deletes or replaces a firewall policy, and every rule in it would go too. The plan above says which."
            exit 1
          fi
          if [[ $EVENT == schedule && $STATUS == 2 ]]; then
            echo "::error::Drift: Azure differs from main. The plan above shows how."
            exit 1
          fi

  # The daily check's result as one issue in the repo (tools/ci/drift.sh): opened or commented on while the
  # check fails or a stack differs from main or its plan did not finish, closed by the first daily check that
  # finds none. Only once check has found mlz-core's commit, which it does first: drift.sh comes from there.
  drift:
    if: always() && github.event_name == 'schedule' && needs.check.outputs.core-ref != ''
    needs: [check, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time per role, so two daily runs (one of them re-run) never both find no issue and open one.
    concurrency:
      group: mlz-drift-${{ inputs.role }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.core-repository }}
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          persist-credentials: false

      # None when no plan job got to plan: drift.sh then reports every stack as not planned.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mlz-${{ inputs.role }}-status-*
          merge-multiple: true
          path: .mlz/

      - name: Open, comment on or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK: ${{ needs.check.result }}
          STACKS: ${{ needs.check.outputs.stacks }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .mlz-core/tools/ci/drift.sh

  # The stacks whose reviewed plan changes something, in the order check gave. Only those wait for a
  # reviewer and apply; a stack with nothing to change asks for no approval. Its output is one apply job
  # each, except for the platform: all its changed stacks in one job, applied in check's order (below).
  changed:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.stacks != '[]'
    needs: [check, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.changed.outputs.stacks }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mlz-${{ inputs.role }}-plan-*
          path: .mlz/reviewed/
          merge-multiple: true

      - id: changed
        env:
          STACKS: ${{ needs.check.outputs.stacks }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          stacks = json.loads(os.environ["STACKS"])
          def changes(stack):  # a missing list counts as changes: the apply then stops on it
              path = pathlib.Path(f".mlz/reviewed/changes-{stack}.txt")
              return not path.exists() or path.read_text().strip() != ""
          changed = [stack for stack in stacks if changes(stack)]
          unchanged = [stack for stack in stacks if stack not in changed]
          jobs = [" ".join(changed)] if os.environ["ROLE"] == "platform" and changed else changed
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"stacks={json.dumps(jobs)}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"To apply: {', '.join(changed) or 'nothing'}. No changes, so no approval: {', '.join(unchanged) or 'none'}.\n")
          EOF

  apply:
    if: needs.changed.result == 'success' && needs.changed.outputs.stacks != '[]'
    needs: [check, changed]
    runs-on: ${{ vars.MLZ_RUNS_ON || 'ubuntu-latest' }} # the private runner once mlz install runners sets it
    timeout-minutes: 120
    environment: ${{ inputs.role }}
    permissions:
      contents: read
      id-token: write # signs in as the apply identity, which only this environment may use
    strategy:
      # A job per stack, except the platform's: one job applies its changed stacks one after the other, hub
      # first, and stops at the first that fails. Management's and identity's networks peer with the hub, and
      # its firewall policy holds the rules. A matrix job each would not do: GitHub orders the creation of
      # matrix jobs, not their runs. Landing zones apply independently, so one failing never stops another.
      fail-fast: false
      max-parallel: 8
      matrix:
        stack: ${{ fromJSON(needs.changed.outputs.stacks) }}
    concurrency:
      group: mlz-apply-${{ inputs.role }}-${{ inputs.role == 'platform' && 'stacks' || matrix.stack }}
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # the apply identity, set on the environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.core-repository }}
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlz-${{ inputs.role }}
          path: .mlz/

      # The changes the reviewer saw; the apply makes exactly these or none. The platform's job takes them all.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mlz-${{ inputs.role }}-plan-${{ inputs.role == 'platform' && '*' || matrix.stack }}
          path: .mlz/reviewed/
          merge-multiple: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      # Vending makes each landing zone's workload repo, gives its team access, its apply environment and its
      # variables, as the MLZ App (docs/vending.md). Administration makes the repo too: tested in a test
      # organization, where it alone did (GitHub lists Repository creation as well, which is not needed).
      - id: github-writer
        if: inputs.role == 'vending'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-contents: write # to rename a new repo's first branch to main
          permission-environments: write
          permission-actions-variables: write
          permission-members: read

      - name: Apply
        env:
          STACKS: ${{ matrix.stack }} # one stack, or the platform's changed stacks in order
          GITHUB_TOKEN: ${{ steps.github-writer.outputs.token }} # vending's GitHub provider; empty for the others
          GITHUB_OWNER: ${{ github.repository_owner }} # its owner when a landing zone has no repo (providers.tf)
        run: |
          for stack in $STACKS; do
            .mlz-core/tools/ci/apply.sh "$ROLE" "$stack"
          done


  # Offers the role's contract to the repos that read it, as a pull request each, after every run on main in
  # which nothing failed: also when no stack changed, so a publication that failed before is retried, and
  # when there is nothing to plan, so removing the last landing zone still empties vending's contract.
  # Governance and platform read theirs from the state, as the read-only plan identity; vending's is its
  # IP plan, from the repo.
  publish:
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.check.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.plan.result)
      && contains(fromJSON('["success", "skipped"]'), needs.changed.result)
      && contains(fromJSON('["success", "skipped"]'), needs.apply.result)
    needs: [check, plan, changed, apply]
    runs-on: ${{ vars.MLZ_RUNS_ON || 'ubuntu-latest' }} # the private runner once mlz install runners sets it
    timeout-minutes: 10
    # One publication at a time; publish.sh skips a run that main has moved past.
    concurrency:
      group: mlz-publish-${{ inputs.role }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # signs in as the plan identity to read the state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.core-repository }}
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          persist-credentials: false

      # The mlz tools read YAML through terraform console (tools/mlz/files.py), and vending's contract comes
      # from its YAML.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - if: inputs.role != 'vending'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: writer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Offer the contract to the repos that read it
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          MLZ_REPOSITORIES: ${{ vars.MLZ_REPOSITORIES }}
        run: .mlz-core/tools/ci/publish.sh "$ROLE"

  # After a landing zone's decommission is applied, its files go in pull requests a person merges
  # (tools/mlz/decommission.py): the platform's rules file for it first, then its own file with its range
  # released. Runs on main, after every run in which the landing zones are as main says: an approved apply, no
  # change to apply, or a daily check without drift, which also offers vending's once the platform's is merged.
  decommission:
    if: >-
      always() && inputs.role == 'vending' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.check.result == 'success' && needs.plan.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.changed.result)
      && contains(fromJSON('["success", "skipped"]'), needs.apply.result)
    needs: [check, plan, changed, apply]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mlz-decommission
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # signs in as vending's plan identity, to see the hubs' firewall policies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.core-repository }}
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          persist-credentials: false

      # The mlz tools read YAML through terraform console (tools/mlz/files.py).
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      # Read-only: the range is released only once the platform's apply has taken the rules out of Azure.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: writer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Offer the pull requests that delete decommissioned landing zones' files
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          MLZ_REPOSITORIES: ${{ vars.MLZ_REPOSITORIES }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          PYTHONPATH: .mlz-core/tools
        run: python3 -m mlz decommission --repo .

  # Each workload repo vending made gets mlz-core's workload starter once, and the landing zone's values whenever they
  # change (tools/mlz/workload.py): after every run on main in which nothing failed, so a repo the apply just made
  # gets its files in the same run.
  workload-repos:
    if: >-
      always() && inputs.role == 'vending' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.check.result == 'success' && needs.check.outputs.stacks != '[]'
      && contains(fromJSON('["success", "skipped"]'), needs.plan.result)
      && contains(fromJSON('["success", "skipped"]'), needs.apply.result)
    needs: [check, plan, apply]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mlz-workload-repos
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.core-repository }}
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          persist-credentials: false

      # The landing zones' configs, as the check worked them out.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlz-${{ inputs.role }}
          path: .mlz/

      # Writing a workflow file needs Workflows as well as Contents.
      - id: writer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-workflows: write

      - name: Give the workload repos their files
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          PYTHONPATH: .mlz-core/tools
        run: python3 -m mlz workload-repos --configs .mlz/vending

  # A contract pull request (tools/ci/publish.sh, mlz install publish) merges itself once this run has checked
  # and planned it: the run on main that the merge starts still waits for the role's reviewer, so a person's
  # merge would add no control. One that fails here stays open, and main never gets it.
  merge:
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'mlz/') && endsWith(github.head_ref, '-contract')
      && needs.check.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.plan.result)
    needs: [check, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.core-repository }}
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          persist-credentials: false

      - id: merger
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the contract
        env:
          GH_TOKEN: ${{ steps.merger.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .mlz-core/tools/ci/merge.sh
