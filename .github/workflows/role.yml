# One role's pipeline, called from the customer's repo with the role's name:
#
#   jobs:
#     mlz:
#       uses: fortytwoservices/mlz-core/.github/workflows/role.yml@v0.1.4
#       with:
#         role: governance
#       secrets: inherit
#
# check  every run: checks the YAML and works out what the roots read.
# plan   pull requests and the daily drift check: read-only, against a copy of the state.
# apply  main: in the role's environment, after a reviewer approves; governance and platform then offer
#        their contract to the repos that read it.
#
# The bootstrap sets the variables (AZURE_*, TFSTATE_*, MLZ_REPOSITORIES); docs/pipelines.md lists the rest.
name: mlz role

on:
  workflow_call:
    inputs:
      role:
        description: "governance, platform or vending"
        type: string
        required: true

permissions: {}

env:
  ROLE: ${{ inputs.role }}
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # to learn which mlz-core release this run comes from
    outputs:
      core-ref: ${{ steps.core.outputs.ref }}
      stacks: ${{ steps.check.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The caller pins mlz-core with uses: ...@<release>; its OIDC token says which, so the code checked
      # out below is always the release the workflow came from.
      - name: Find the mlz-core release
        id: core
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mlz-core" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          ref=$(python3 -c 'import base64, json, sys
          part = sys.argv[1].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          print(claims["job_workflow_ref"].split("@", 1)[1])' "$token")
          echo "mlz-core $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AZ_TF_MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.AZ_TF_MODULE_READER_PRIVATE_KEY }}
          owner: fortytwoservices
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fortytwoservices/mlz-core
          ref: ${{ steps.core.outputs.ref }}
          path: .mlz-core
          token: ${{ steps.reader.outputs.token }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Check the YAML
        id: check
        run: echo "stacks=$(.mlz-core/tools/ci/check.sh "$ROLE")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlz-${{ inputs.role }}
          path: .mlz/
          include-hidden-files: true
          retention-days: 7

  plan:
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule') && needs.check.outputs.stacks != '[]'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # signs in as the plan identity
      pull-requests: write  # puts the plan on the pull request
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.check.outputs.stacks) }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # the plan identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AZ_TF_MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.AZ_TF_MODULE_READER_PRIVATE_KEY }}
          owner: fortytwoservices
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fortytwoservices/mlz-core
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          token: ${{ steps.reader.outputs.token }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlz-${{ inputs.role }}
          path: .mlz/

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Plan
        id: plan
        env:
          # The modules are internal repos; only this step gets the token.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.reader.outputs.token }}@github.com/fortytwoservices/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/fortytwoservices/
          STACK: ${{ matrix.stack }}
        run: |
          set +e
          .mlz-core/tools/ci/plan.sh "$ROLE" "$STACK"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Put the plan on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STACK: ${{ matrix.stack }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: .mlz-core/tools/ci/comment.sh "$STACK" "$STATUS"

      - name: Result
        env:
          EVENT: ${{ github.event_name }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: |
          if [[ $STATUS == 1 ]]; then echo "::error::The plan failed."; exit 1; fi
          if [[ $EVENT == schedule && $STATUS == 2 ]]; then
            echo "::error::Drift: Azure differs from main. The plan above shows how."
            exit 1
          fi

  apply:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.stacks != '[]'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.role }}
    permissions:
      contents: read
      id-token: write # signs in as the apply identity, which only this environment may use
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.check.outputs.stacks) }}
    concurrency:
      group: mlz-apply-${{ inputs.role }}-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # the apply identity, set on the environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AZ_TF_MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.AZ_TF_MODULE_READER_PRIVATE_KEY }}
          owner: fortytwoservices
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fortytwoservices/mlz-core
          ref: ${{ needs.check.outputs.core-ref }}
          path: .mlz-core
          token: ${{ steps.reader.outputs.token }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlz-${{ inputs.role }}
          path: .mlz/

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Apply
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.reader.outputs.token }}@github.com/fortytwoservices/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/fortytwoservices/
          STACK: ${{ matrix.stack }}
        run: .mlz-core/tools/ci/apply.sh "$ROLE" "$STACK"

      - id: writer
        if: inputs.role != 'vending'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MLZ_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLZ_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Offer the contract to the repos that read it
        if: inputs.role != 'vending'
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          MLZ_REPOSITORIES: ${{ vars.MLZ_REPOSITORIES }}
        run: .mlz-core/tools/ci/publish.sh "$ROLE"
